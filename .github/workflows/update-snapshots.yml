name: Update Playwright snapshots

# Add the "update-snapshots" label to a PR, or run it from the Actions tab on
# the branch whose baselines should change. Baselines are only ever made here
# (Linux + Edge), never on a dev machine.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: update-snapshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # commit the new images (fallback without the app)
  pull-requests: write # take the label off again, comment on the PR

env:
  CI: "true"
  DATABASE_URL: postgres://erp:erp@localhost:5432/scaffolding_erp_test
  # Throwaway values for the CI-only database; never used anywhere else.
  BETTER_AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789
  E2E_PASSWORD: e2e-pass-1234

jobs:
  update:
    name: Update visual baselines
    # Labels on PRs from forks cannot push; other labels do nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'update-snapshots' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required checks only count runs from events such as pull_request, so the
    # baseline commit must start a normal pull_request run. A GITHUB_TOKEN push
    # starts one that waits for "Approve workflows to run"; a push made with
    # the snapshots GitHub App's token starts one right away. Set up the app
    # as described in CLAUDE.md (secrets SNAPSHOTS_APP_ID and
    # SNAPSHOTS_APP_PRIVATE_KEY).
    env:
      HAS_APP: ${{ secrets.SNAPSHOTS_APP_ID != '' }}
    # Screens are behind sign-in: the dev server needs a database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: scaffolding_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d scaffolding_erp_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Get the snapshots app token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SNAPSHOTS_APP_ID }}
          private-key: ${{ secrets.SNAPSHOTS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          # The PR branch itself, not the merge commit of a pull_request run.
          ref: ${{ github.head_ref || github.ref_name }}
          # The push below uses the token checkout stores.
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrate the database
        run: npm run db:migrate
      - name: Install Edge
        run: npx playwright install --with-deps msedge
      - name: Write baselines
        run: npx playwright test --grep @visual --project desktop-1280 --update-snapshots=all
      - name: Commit baselines
        id: commit
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Baselines unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "test: update Playwright visual baselines"
            git push origin "HEAD:${BRANCH}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Committed new baselines to ${BRANCH}." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Without the app the CI run on the new commit waits for approval.
      - name: Ask for approval of the CI run
        if: steps.commit.outputs.changed == 'true' && env.HAS_APP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MSG: >-
            New visual baselines were committed. CI on that commit waits for
            approval: open the PR's checks box and click **Approve workflows
            to run** (or set up the snapshots app, see CLAUDE.md).
        run: |
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PR" != "" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          fi
      # So the label can be added again after the next visual change.
      - name: Remove the label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label update-snapshots
