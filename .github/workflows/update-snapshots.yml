name: Update Playwright snapshots

# Run from the Actions tab on the branch whose baselines should change.
# Baselines are only ever made here (Linux + Edge), never on a dev machine.
on:
  workflow_dispatch:

concurrency:
  group: update-snapshots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # commit the new images
  actions: write # re-run ci.yml on the branch

env:
  CI: "true"
  DATABASE_URL: postgres://erp:erp@localhost:5432/scaffolding_erp_test
  # Throwaway values for the CI-only database; never used anywhere else.
  BETTER_AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789
  E2E_PASSWORD: e2e-pass-1234

jobs:
  update:
    name: Update visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Screens are behind sign-in: the dev server needs a database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: scaffolding_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d scaffolding_erp_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrate the database
        run: npm run db:migrate
      - name: Install Edge
        run: npx playwright install --with-deps msedge
      - name: Write baselines
        run: npx playwright test --grep @visual --project desktop-1280 --update-snapshots=all
      - name: Commit baselines
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Baselines unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            # [skip ci]: a GITHUB_TOKEN push still opens a pull_request run that
            # waits for approval and hides the dispatched run below on the PR.
            git commit -m "test: update Playwright visual baselines [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Committed new baselines to ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
          fi
      # workflow_dispatch is not affected by [skip ci]. The run checks the new
      # commit and shows on the PR.
      - name: Re-run CI on the branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
