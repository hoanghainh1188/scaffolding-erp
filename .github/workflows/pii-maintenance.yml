name: Personal Data Maintenance

# Run by hand, approved like a deploy, so production keys never reach a
# personal machine (personal-data-protection D4). Commands print row counts
# only; keep each run's log in the compliance file (docs/ops/personal-data.md).
#
# The CCCD keys live only in the environment `production-pii`, which needs a
# reviewer other than the one who started the run and deploys from `main`
# only (docs/ops/personal-data.md mục 1). Scheduled jobs (backup, inventory
# check) use `production` and never see the keys. Actions are pinned by SHA.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Lệnh cần chạy"
        required: true
        type: choice
        options:
          - rotate
          - rotate-check
          - purge

concurrency:
  group: production-pii-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Run ${{ inputs.command }}
    # A branch could change the scripts and read the keys: main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Own environment: required reviewer, main only, and the only place that
    # holds the CCCD key (production keeps no copy of it).
    environment: production-pii
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PROD_DATABASE_URL is the app role erp_app: enough for every command.
      - name: Run the command
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PII_ENCRYPTION_KEYS: ${{ secrets.PROD_PII_ENCRYPTION_KEYS }}
          COMMAND: ${{ inputs.command }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PII_ENCRYPTION_KEYS" ]; then
            echo "::error::PROD_DATABASE_URL and PROD_PII_ENCRYPTION_KEYS are required."
            exit 1
          fi
          case "$COMMAND" in
            rotate) npm run pii:rotate ;;
            rotate-check) npm run pii:rotate -- --check ;;
            purge) npm run pii:purge ;;
            *) echo "::error::Unknown command"; exit 2 ;;
          esac
