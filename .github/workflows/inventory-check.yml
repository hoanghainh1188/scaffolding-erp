name: Inventory Ledger Audit

on:
  schedule:
    # 20:00 UTC is 03:00 AM Vietnam time (UTC+7)
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: production-inventory-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit inventory ledger consistency
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run inventory ledger verification
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret is required to perform audit."
            exit 1
          fi

          echo "Running inventory consistency audit against production database..."
          npm run inventory:check

      - name: Ledger audit summary
        if: always()
        run: |
          echo "### Inventory Ledger Audit Status" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Audit Time**: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ job.status == 'success' && '✅ All ledger balances match physical invariants.' || '❌ Ledger discrepancy detected! Requires immediate review.' }}" >> "$GITHUB_STEP_SUMMARY"
