name: Deploy Demo

on:
  # Vercel deploys every push to main, so a new migration must reach the
  # Neon seed and demo branches at the same time or the demo breaks (a
  # missing column fails sign-in). Pushes only migrate: no reseed, no reset.
  push:
    branches: [main]
    paths:
      - "drizzle/**"
  workflow_dispatch:
    inputs:
      reseed:
        description: "Re-seed demo data on seed branch after migration"
        type: boolean
        default: false
      reset_demo_branch:
        description: "Reset demo branch from seed branch using neonctl"
        type: boolean
        default: false

concurrency:
  group: demo-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate database and deploy demo
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # DEMO_SEED_DATABASE_URL and DEMO_DATABASE_URL_UNPOOLED are the owner
      # role (neondb_owner); migrate also grants the app role erp_app.
      - name: Migrate Neon seed branch (owner, unpooled direct URL)
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.DEMO_SEED_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL_MIGRATE" ]; then
            echo "::error::DEMO_SEED_DATABASE_URL is required to run migrations."
            exit 1
          fi
          echo "Running migrations on seed branch..."
          npm run db:migrate

      - name: Optionally re-seed clean baseline data
        if: ${{ inputs.reseed }}
        env:
          NODE_ENV: development
          DATABASE_URL: ${{ secrets.DEMO_SEED_DATABASE_URL }}
          DEV_SEED_PASSWORD: ${{ secrets.DEV_SEED_PASSWORD }}
        # The seed only hashes passwords; it signs no session, so a throwaway
        # secret is enough and the app's real secret stays on Vercel only.
        run: |
          BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$BETTER_AUTH_SECRET"
          export BETTER_AUTH_SECRET
          # The demo seed stores no CCCD, so this key encrypts nothing.
          PII_ENCRYPTION_KEYS="1:$(openssl rand -base64 32)"
          echo "::add-mask::$PII_ENCRYPTION_KEYS"
          export PII_ENCRYPTION_KEYS
          echo "Seeding updated demo data..."
          npm run db:seed:demo

      - name: Update demo branch schema (migrate or reset from seed)
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.DEMO_DATABASE_URL_UNPOOLED }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          RESET_DEMO: ${{ inputs.reset_demo_branch }}
        run: |
          if [ "$RESET_DEMO" = "true" ] && [ -n "$NEON_API_KEY" ] && [ -n "$NEON_PROJECT_ID" ]; then
            echo "Resetting demo branch directly from updated seed branch..."
            npx --yes neonctl branches reset demo --parent \
              --project-id "$NEON_PROJECT_ID" \
              --api-key "$NEON_API_KEY"
          elif [ -n "$DATABASE_URL_MIGRATE" ]; then
            echo "Running direct migrations on demo branch..."
            npm run db:migrate
          else
            echo "No demo unpooled URL or reset option specified; skipping demo branch migration."
          fi

      # A push to main already deploys on Vercel through the Git integration.
      - name: Trigger Vercel Deploy Hook
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is required to trigger deployment."
            exit 1
          fi
          echo "Triggering Vercel deployment hook..."
          curl -s -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Wait and verify health check
        env:
          DEMO_URL: ${{ secrets.DEMO_URL }}
        run: |
          URL="${DEMO_URL:-https://scaffolding-erp-demo.vercel.app}"
          echo "Waiting 20 seconds for deployment to begin..."
          sleep 20
          echo "Verifying health endpoint at $URL/api/health..."
          curl --fail --retry 15 --retry-delay 5 -s "$URL/api/health" | grep -q '"status":"ok"'
          echo "Demo deployment verified healthy."
