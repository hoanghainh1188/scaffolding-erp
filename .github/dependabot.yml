# Weekly update PRs (#100). Minor and patch bumps come as one grouped PR per
# ecosystem; majors stay separate because they need a careful read (Next.js,
# Better Auth, Drizzle). Security updates are opened as soon as an alert fires.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    # package.json pins exact versions; keep it that way.
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
